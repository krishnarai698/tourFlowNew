spring.application.name=tourFlow

# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:tourflowdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# External API Keys (replace with your keys)
tourflow.api.openweathermap.key=YOUR_OPENWEATHERMAP_API_KEY
tourflow.api.openweathermap.base-url=https://api.openweathermap.org/data/2.5
tourflow.api.googlemaps.key=YOUR_GOOGLE_MAPS_API_KEY
tourflow.api.googlemaps.base-url=https://maps.googleapis.com/maps/api

# Crowd Prediction Settings
tourflow.crowd.update-interval-seconds=30
tourflow.crowd.high-threshold=75
tourflow.crowd.critical-threshold=90
